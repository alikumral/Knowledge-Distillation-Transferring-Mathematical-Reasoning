# Eval config for the extra seeds: GSM8K + MATH (both benchmarks for mean±std),
# but latency OFF (inference speed is seed-independent; measured once on seed 0).
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

decoding:
  do_sample: false
  temperature: 0.0
  max_new_tokens: 512

batch_size: 256

splits:
  gsm8k_test: true
  math_ood: true

latency:
  enabled: false        # seed-independent; already measured on seed 0
  n_runs: 50
  batch_size: 1
  warmup: 5

output_dir: results/predictions
